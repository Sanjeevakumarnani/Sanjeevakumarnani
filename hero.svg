<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Suguru Sanjeeva Kumar — developer profile</title>
<desc id="desc">A burgundy developer profile banner with a technical grid, editorial typography, and abstract orbital geometry.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10070C"/><stop offset=".52" stop-color="#190B12"/><stop offset="1" stop-color="#451126"/></linearGradient>
  <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#701A3D" stop-opacity=".1"/><stop offset=".5" stop-color="#E5B5C7"/><stop offset="1" stop-color="#701A3D" stop-opacity=".1"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#C77B9B" stop-opacity=".28"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E5B5C7" stroke-opacity=".075" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="460" rx="26" fill="url(#bg)"/>
<rect width="1200" height="460" rx="26" fill="url(#grid)"/>
<circle cx="930" cy="224" r="275" fill="url(#glow)"/>
<rect x="14" y="14" width="1172" height="432" rx="20" fill="none" stroke="#701A3D" stroke-width="1.5"/>
<path d="M38 36H1162" stroke="url(#stroke)" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif">
  <text x="54" y="68" font-family="monospace" font-size="12" letter-spacing="3" fill="#C77B9B">S K / DEVELOPER IDENTITY</text>
  <text x="1144" y="68" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="end" fill="#E5B5C7">HYDERABAD · INDIA</text>
  <text x="54" y="151" font-size="52" font-weight="700" letter-spacing="-1.5" fill="#F8F0F3">SUGURU SANJEEVA</text>
  <text x="54" y="211" font-size="52" font-weight="700" letter-spacing="-1.5" fill="#E5B5C7">KUMAR.</text>
  <path d="M54 232H515" stroke="url(#stroke)" stroke-width="2"/>
  <text x="54" y="270" font-family="monospace" font-size="14" letter-spacing=".4" fill="#F8F0F3">FULL-STACK DEVELOPER</text>
  <text x="54" y="297" font-family="monospace" font-size="14" letter-spacing=".4" fill="#C77B9B">AI-ENABLED SYSTEMS · BACKEND ENGINEERING</text>
  <text x="54" y="351" font-family="monospace" font-size="12" letter-spacing="1.3" fill="#E5B5C7">BUILDING SOFTWARE AROUND PROBLEMS WORTH SOLVING</text>
  <text x="54" y="414" font-family="monospace" font-size="11" letter-spacing="1.2" fill="#C77B9B">PYTHON / TYPESCRIPT / REACT / FASTAPI / POSTGRESQL / KOTLIN</text>
</g>
<g transform="translate(900 235)" fill="none" stroke-linecap="round">
  <circle r="155" stroke="#701A3D" stroke-width="2"/>
  <circle r="120" stroke="#C77B9B" stroke-opacity=".75" stroke-dasharray="2 10"/>
  <ellipse rx="155" ry="63" stroke="#E5B5C7" stroke-opacity=".75" transform="rotate(-32)"/>
  <ellipse rx="155" ry="63" stroke="#C77B9B" stroke-opacity=".7" transform="rotate(32)"/>
  <circle r="77" fill="#190B12" stroke="#C77B9B" stroke-width="1.5"/>
  <path d="M-32 -12L-8 -36L16 -12L-8 12Z M8 12L32 36L8 60L-16 36Z" stroke="#E5B5C7" stroke-width="2.5"/>
  <circle r="7" fill="#E5B5C7" stroke="none"/>
  <circle cx="149" cy="-42" r="5" fill="#E5B5C7" stroke="none"/>
  <circle cx="-122" cy="89" r="4" fill="#C77B9B" stroke="none"/>
</g>
<g font-family="monospace" font-size="10" fill="#C77B9B">
  <text x="741" y="100">01 / DESIGN</text>
  <text x="1042" y="390">02 / BUILD</text>
