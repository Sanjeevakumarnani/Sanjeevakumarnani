<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suguru Sanjeeva Kumar — GitHub Profile Preview</title>
  <style>
    :root { color-scheme: dark; --bg:#10070C; --panel:#190B12; --wine:#451126; --accent:#701A3D; --rose:#C77B9B; --pale:#E5B5C7; --ivory:#F8F0F3; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ivory); font-family:Arial,Helvetica,sans-serif; }
    .wrap { max-width:1080px; margin:32px auto; padding:20px; }
    header { margin-bottom:24px; color:var(--pale); font:12px ui-monospace,SFMono-Regular,Consolas,monospace; letter-spacing:2px; }
    section { margin:22px 0; padding:18px; background:var(--panel); border:1px solid var(--wine); border-radius:18px; }
    h2 { margin:0 0 14px; color:var(--pale); font-size:16px; font-weight:600; }
    img { display:block; max-width:100%; height:auto; }
    .themes { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .themes img { width:100%; border-radius:10px; }
    a { color:var(--pale); }
    .caption { margin-top:8px; color:var(--rose); font:11px ui-monospace,SFMono-Regular,Consolas,monospace; }
    @media(max-width:650px) { .wrap { margin:12px auto; padding:12px; } section { padding:12px; } .themes { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header>S K / GITHUB PROFILE PREVIEW</header>
    <section>
      <h2>Profile hero — default banner</h2>
      <img src="hero.svg?v=20261017" alt="Suguru Sanjeeva Kumar — burgundy developer profile banner">
      <p class="caption">hero.svg · Root README image asset</p>
    </section>
    <section>
      <h2>Theme variants</h2>
      <div class="themes">
        <div><img src="dark.svg?v=20261017" alt="Dark burgundy profile banner"><p class="caption">Dark theme</p></div>
        <div><img src="light.svg?v=20261017" alt="Light burgundy profile banner"><p class="caption">Light theme</p></div>
      </div>
    </section>
    <section>
      <h2>Profile footer</h2>
      <img src="assets/footer.svg?v=20261017" alt="Build with intention. Learn continuously. Ship thoughtfully.">
    </section>
    <section>
      <h2>Contribution animation</h2>
      <img src="https://raw.githubusercontent.com/Sanjeevakumarnani/Sanjeevakumarnani/output/github-snake.svg?v=20261017" alt="GitHub contribution animation">
      <p class="caption">Generated by GitHub Actions</p>
    </section>
    <section>
      <h2>Open profile</h2>
      <p><a href="https://github.com/Sanjeevakumarnani/Sanjeevakumarnani">GitHub profile README repository</a> · <a href="https://sanjeevakumarnani.github.io">Portfolio</a></p>
    </section>
  </main>
</body>
</html>
