<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"><defs><pattern id="d" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#21304d" opacity=".45"/></pattern><style><![CDATA[text{font-family:Arial,sans-serif}.off{fill:#f4f6fa}.muted{fill:#91a1bf}.blue{fill:#247bff}.pink{fill:#ff354f}.cap{font-size:12px;letter-spacing:2px}.h2{font-size:23px;font-weight:800}.body{font-size:14px}.small{font-size:11px}@media(prefers-reduced-motion:reduce){*{animation:none!important}}]]></style></defs><rect width="900" height="430" rx="28" fill="#070b16"/><rect width="900" height="430" rx="28" fill="url(#d)"/><text x="34" y="43" class="cap pink">ABOUT / LIFE OUTSIDE CODE</text><rect x="24" y="60" width="850" height="345" rx="22" fill="#0b1324" stroke="#213253"/><text x="48" y="105" class="h2 off">Turning Ideas Into <tspan class="blue">Real-World Impact</tspan></text><text x="48" y="139" class="body muted">CSE student and builder focused on deployable products,</text><text x="48" y="160" class="body muted">AI-assisted systems, web, backend and Android.</text><text x="48" y="181" class="body muted">I learn by building, testing and shipping real software.</text><text x="48" y="204" class="small off">CAPABILITIES</text><circle cx="57" cy="225" r="11" fill="#247bff" opacity=".25"/><circle cx="57" cy="225" r="4" fill="#247bff"/><text x="78" y="222" class="body off">AI &amp; Automation</text><text x="78" y="238" class="small muted">AI-powered applications</text><circle cx="57" cy="264" r="11" fill="#ff354f" opacity=".25"/><circle cx="57" cy="264" r="4" fill="#ff354f"/><text x="78" y="261" class="body off">Full-Stack Development</text><text x="78" y="277" class="small muted">Web, backend and mobile systems</text><circle cx="57" cy="303" r="11" fill="#7b61ff" opacity=".25"/><circle cx="57" cy="303" r="4" fill="#7b61ff"/><text x="78" y="300" class="body off">Problem Solving</text><text x="78" y="316" class="small muted">Hackathons and real-world software</text><circle cx="57" cy="342" r="11" fill="#23c97d" opacity=".25"/><circle cx="57" cy="342" r="4" fill="#23c97d"/><text x="78" y="339" class="body off">Open Source</text><text x="78" y="355" class="small muted">Build · learn · contribute</text><circle cx="57" cy="381" r="11" fill="#ffb020" opacity=".25"/><circle cx="57" cy="381" r="4" fill="#ffb020"/><text x="78" y="378" class="body off">Continuous Learning</text><text x="78" y="394" class="small muted">New technologies and stronger systems</text><line x1="516" y1="82" x2="516" y2="383" stroke="#273a5d"/><text x="546" y="104" class="body off">OUTSIDE OF TECH</text><rect x="544" y="125" width="286" height="220" rx="16" fill="#101b30" stroke="#2b4a76"/><g><text x="566" y="160" class="h2 off">Hackathons</text><text x="566" y="184" class="small muted">Rapid prototypes, problem solving</text><text x="566" y="201" class="small muted">and shipping under constraints.</text><text x="566" y="326" class="small blue">01 / 03</text><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.28;.36;.92;1" dur="12s" repeatCount="indefinite"/></g><g opacity="0"><text x="566" y="160" class="h2 off">Embedded Builds</text><text x="566" y="184" class="small muted">ESP32, sensors, safety systems</text><text x="566" y="201" class="small muted">and practical hardware experiments.</text><text x="566" y="326" class="small blue">02 / 03</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.28;.36;.92;1" dur="12s" repeatCount="indefinite"/></g><g opacity="0"><text x="566" y="160" class="h2 off">Sports &amp; Exploration</text><text x="566" y="184" class="small muted">Badminton, new places, new ideas,</text><text x="566" y="201" class="small muted">and different ways to learn.</text><text x="566" y="326" class="small blue">03 / 03</text><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.28;.36;.92;1" dur="12s" repeatCount="indefinite"/></g><path d="M566 347h195" stroke="#294363"/><path d="M566 347h70" stroke="#247bff" stroke-width="4"/><text x="48" y="397" class="small muted">Consistent learning. Better systems.</text></svg>