<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<style>
  .bg{fill:#030712}.grid{stroke:#0f3d3e;stroke-width:1;opacity:.35}
  .cyan{fill:#22d3ee}.green{fill:#39ff88}.white{fill:#e2e8f0}.muted{fill:#64748b}
  .mono{font-family:'Courier New',monospace}.scan{animation:scan 4s linear infinite}.blink{animation:blink 1s steps(2) infinite}
  .pulse{animation:pulse 2s ease-in-out infinite}.float{animation:float 3s ease-in-out infinite}
  .rain{font-family:monospace;font-size:15px;fill:#22d3ee;opacity:.2}
  @keyframes scan{0%{transform:translateY(0);opacity:.15}50%{transform:translateY(400px);opacity:.45}100%{transform:translateY(0);opacity:.15}}
  @keyframes blink{50%{opacity:0}}
  @keyframes pulse{50%{opacity:.35}}
  @keyframes float{50%{transform:translateY(-7px)}}
</style>
