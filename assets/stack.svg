<rect x="34" y="241" width="832" height="111" rx="13" fill="#210815" stroke="#8F244E"/>
<text x="52" y="270" class="cap pink">PLATFORM &amp; WORKFLOW</text>
<g fill="#FFF6F8" font-family="Arial,sans-serif" font-size="14">
